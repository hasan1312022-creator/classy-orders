<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>سيستم الأوردرات</title>
<style>
:root{--bg:#f6f5f2;--card:#fff;--tx:#1f1f1f;--mut:#6b6b6b;--bd:#e2e0da;--pr:#7a3e8e;--prt:#fff;--ok:#1f8a4c;--wr:#b7791f;--er:#c0392b}
@media(prefers-color-scheme:dark){:root{--bg:#171517;--card:#242125;--tx:#efecef;--mut:#a29da3;--bd:#3a363b;--pr:#c58ad8;--prt:#1a1a1a;--ok:#4cc27d;--wr:#e0b04f;--er:#ec7b6e;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif}
main{max-width:760px;margin:0 auto;padding:12px}h1{font-size:18px;margin:4px 0}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
button,select,input,textarea{font:inherit;color:var(--tx)}
nav{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px}nav button{white-space:nowrap;padding:8px 14px;border:1px solid var(--bd);background:var(--card);border-radius:20px;cursor:pointer}nav button.on{background:var(--pr);color:var(--prt);border-color:var(--pr)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
label{display:block;font-size:13px;color:var(--mut);margin:8px 0 3px}input,select,textarea{width:100%;padding:9px;border:1px solid var(--bd);border-radius:8px;background:var(--bg)}textarea{min-height:64px}
.btn{padding:10px 16px;border:0;border-radius:8px;background:var(--pr);color:var(--prt);cursor:pointer;margin-top:10px}.btn.sec{background:transparent;color:var(--tx);border:1px solid var(--bd)}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1;min-width:120px}.hd{display:flex;justify-content:space-between;align-items:center;gap:8px}.no{font-weight:700;font-size:16px}
.bd{font-size:12px;padding:2px 10px;border-radius:12px;border:1px solid currentColor;white-space:nowrap}
.s-new,.s-preparing{color:var(--wr)}.s-shipped,.s-delivered{color:var(--ok)}.s-indelivery{color:var(--pr)}.s-unavailable,.s-refused,.s-cancelled{color:var(--er)}.s-partial{color:var(--pr)}
.m{color:var(--mut);font-size:13px}.note{background:var(--bg);border-radius:8px;padding:6px 9px;margin-top:6px;font-size:14px}
.ph{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.ph img{width:72px;height:72px;object-fit:cover;border-radius:8px;border:1px solid var(--bd);cursor:pointer}
.scroll{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px;white-space:nowrap}td,th{padding:6px 8px;border-bottom:1px solid var(--bd);text-align:center}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-bottom:10px}.stats div{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:8px;text-align:center}.stats b{display:block;font-size:20px}
.empty{text-align:center;color:var(--mut);padding:28px 0}
</style>
</head>

async function init(){
  const {data}=await sb.auth.getSession();
  if(!data.session)return new URLSearchParams(location.search).get("signup")?signupView():loginView();

function drawLines(k="lines"){

  box.innerHTML=S[k].map((l,i)=>`<div class="row" style="margin-bottom:6px"><select data-lb="${i}"><option value="">البراند</option>${brands.map(b=>`<option value="${qa(b)}" ${l.brand===b?"selected":""}>${esc(b)}</option>`).join("")}</select><select data-lc="${i}"><option value="">اللون</option>${S.stock.filter(x=>x.brand===l.brand).map(x=>`<option value="${x.id}" ${l.sid==x.id?"selected":""}>${esc(x.color)} (${x.qty}${x.singles?" + فردة":""})</option>`).join("")}</select><input type="number" min="1" inputmode="numeric" style="max-width:80px" data-lq="${i}" value="${l.q}"><button class="btn sec" type="button" style="margin:0;flex:0 0 auto;min-width:0" data-ld="${i}">✖</button></div>${eyeRow(l,i)}`).join("")||'<div class="m">اضغط ➕ لإضافة صنف</div>';
  box.querySelectorAll("[data-lb]").forEach(e=>e.onchange=()=>{const i=e.dataset.lb;S[k][i]={brand:e.value,sid:0,color:"",q:S[k][i].q,rm:"p",lm:"p"};drawLines(k)});
  box.querySelectorAll("[data-lc]").forEach(e=>e.onchange=()=>{const i=e.dataset.lc,st=S.stock.find(x=>x.id==e.value);S[k][i].sid=st?st.id:0;S[k][i].color=st?st.color:"";S[k][i].rm="p";S[k][i].lm="p";S[k][i].pr="";S[k][i].pl="";drawLines(k)});
  box.querySelectorAll("[data-lq]").forEach(e=>e.onchange=()=>{const l=S[k][e.dataset.lq],nq=Math.max(1,parseInt(e.value)||1);if(l.pe!=null&&l.q>0)l.pe=Math.round(l.pe/l.q*nq);l.q=nq});
  box.querySelectorAll("[data-ld]").forEach(e=>e.onclick=()=>{S[k].splice(e.dataset.ld,1);drawLines(k)});
  box.querySelectorAll("[data-em]").forEach(e=>e.onchange=()=>{const sd=e.dataset.em[0],i=e.dataset.em.slice(1),l=S[k][i];if(sd==="r"){l.rm=e.value;l.pr=""}else{l.lm=e.value;l.pl=""}drawLines(k)});
  box.querySelectorAll("[data-ev]").forEach(e=>e.onchange=()=>{const sd=e.dataset.ev[0],i=e.dataset.ev.slice(1),l=S[k][i];if(sd==="r")l.pr=e.value;else l.pl=e.value});
}

  let p=String(o.phone||"").replace(/\D/g,"");if(p.startsWith("0020"))p=p.slice(2);else if(p.startsWith("0"))p="2"+p;

function bars(a){
  const m=Math.max(1,...a.map(x=>x[1]));
  return a.length?a.map(x=>`<div style="display:flex;align-items:center;gap:6px;margin:5px 0"><span style="flex:0 0 110px;font-size:12px">${esc(x[0])}</span><div style="flex:1;background:var(--bd);border-radius:4px"><div style="width:${x[1]/m*100}%;background:var(--pr);height:14px;border-radius:4px"></div></div><b style="min-width:44px;text-align:left">${x[2]??x[1]}</b></div>`).join(""):'<div class="m">مفيش بيانات لسه</div>';
}
function homeView(){
  const r=S.role,t=today(),all0=S.dash,all=all0.filter(o=>o.kind!=="replacement"),td=all0.filter(o=>o.order_date===t),adm=r==="admin";
  const c=(a,f)=>a.filter(f).length,sum=a=>a.filter(o=>o.status!=="cancelled"&&o.kind!=="replacement").reduce((s,o)=>s+(Number(o.total)||0),0),dv=a=>a.filter(o=>o.status==="delivered"&&o.kind!=="replacement").reduce((s,o)=>s+(Number(o.total)||0),0);
  const cd=(n,l)=>`<div><b>${n}</b>${l}</div>`,sec=(ti,b)=>`<div class="card"><b>${ti}</b>${b}</div>`;
  let h=`<div class="m" style="margin-bottom:6px">النهارده (${t})</div><div class="stats">${cd(td.length,"أوردرات اليوم")}${cd(c(td,o=>o.status==="new"),"جديدة")}${cd(c(td,o=>o.status==="preparing"),"جاري التجهيز")}${cd(c(td,o=>["shipped","indelivery"].includes(o.status)),"تم الشحن")}${cd(c(td,o=>o.status==="delivered"),"تم التسليم")}${cd(c(td,o=>o.status==="cancelled"),"ملغية")}</div>`;
  if(adm){
    const done=c(all,o=>o.status==="delivered"),fail=c(all,o=>["refused","cancelled","unavailable"].includes(o.status));
    h+=`<div class="m" style="margin-bottom:6px">المبيعات</div><div class="stats">${cd(money(sum(td)),"مبيعات اليوم (مسجّلة)")}${cd(money(dv(td)),"مبيعات اليوم (مسلّمة)")}${cd(money(sum(all)),"مبيعات الشهر (مسجّلة)")}${cd(money(dv(all)),"مبيعات الشهر (مسلّمة)")}${cd(done+fail?Math.round(done/(done+fail)*100)+"%":"-","معدل نجاح الأوردرات")}</div>`;
    const days={};all.filter(o=>o.status!=="cancelled").forEach(o=>days[o.order_date]=(days[o.order_date]||0)+(Number(o.total)||0));
    h+=sec("المبيعات اليومية (الشهر ده)",bars(Object.keys(days).sort().reverse().map(d=>[d.slice(5),days[d],money(days[d])])));
    const pm={};all.filter(o=>!["cancelled","unavailable","refused"].includes(o.status)).forEach(o=>(o.lines||[]).forEach(l=>{if(l.gift)return;const k=l.brand+" "+l.color;pm[k]=(pm[k]||0)+l.q}));
    h+=sec("أفضل المنتجات مبيعًا (قطع، الشهر ده)",bars(Object.entries(pm).sort((a,b)=>b[1]-a[1]).slice(0,8)));
  }
  if(adm||r==="mod")h+=sec("مصادر الأوردرات (الشهر ده)",bars(Object.entries(SRC).map(([k,v])=>[v,c(all,o=>o.source===k)]).sort((a,b)=>b[1]-a[1])));
  return h+'<div class="m">معدل النجاح = المسلّم ÷ (المسلّم + المرفوض + الملغي + غير المتوفر).</div>';
}

async function showHist(raw){

  const dv=l.filter(o=>o.status==="delivered"),rf=l.filter(o=>["refused","partial"].includes(o.status)),cx=l.filter(o=>o.status==="cancelled");

async function xl(){if(window.XLSX)return;await new Promise((ok,no)=>{const s=document.createElement("script");s.src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js";s.onload=ok;s.onerror=no;document.head.appendChild(s)})}
async function fetchAll(table,f){let all=[],from=0;while(true){let q=sb.from(table).select("*");if(f)q=f(q);const {data,error}=await q.range(from,from+999);if(error)throw error;all=all.concat(data||[]);if(!data||data.length<1000)break;from+=1000}return all}

async function doExport(){

    all.forEach(o=>(days[o.order_date]=days[o.order_date]||[]).push(o));const c=(a,fn)=>a.filter(fn).length;
    const sm=Object.keys(days).sort().map(d=>{const a=days[d];return{"اليوم":d,"طُلب":a.length,"اتشحن":c(a,o=>["shipped","indelivery","delivered","refused","partial"].includes(o.status)),"معلق":c(a,o=>["new","preparing"].includes(o.status)),"غير متوفر":c(a,o=>o.status==="unavailable"),"تم التسليم":c(a,o=>o.status==="delivered"),"رفض/جزئي":c(a,o=>["refused","partial"].includes(o.status)),"ملغي":c(a,o=>o.status==="cancelled"),"الإجمالي":a.filter(o=>o.status!=="cancelled"&&o.kind!=="replacement").reduce((s,o)=>s+(Number(o.total)||0),0)}});
    const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(all.map(orow)),"أوردرات");XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(sm),"ملخص يومي");XLSX.writeFile(wb,"orders-"+f+"-to-"+t+".xlsx");m.textContent="تم التصدير ("+all.length+" أوردر)"}
  catch(e){m.textContent="تعذر التصدير: "+(e.message||"تأكد من الاتصال")}

  if(error){box.innerHTML='<div class="note">تعذر تحميل السجل (اتأكد إنك شغّلت update-5).</div>';return}
  box.innerHTML='<div class="note">'+((data||[]).map(r=>{const t=new Date(r.at).toLocaleString("ar-EG",{timeZone:"Africa/Cairo"}),d=r.details||{};
    const body=r.action==="created"?"سجّل الأوردر":Object.entries(d).map(([k,v])=>k==="status"?"الحالة: "+(ST[v[0]]||v[0])+" ← "+(ST[v[1]]||v[1]):(FN[k]||k)+": "+v[0]+" ← "+v[1]).join(" | ");

async function returnPieces(id){
  const o=S.orders.find(x=>x.id==id);if(!o)return;const back=[],nl=[];
  for(const l of o.lines){const v=prompt(l.brand+" "+l.color+": كم قطعة رجعت من "+l.q+"؟ (0 لو مفيش)","0");if(v===null)return;const n=Math.min(l.q,Math.max(0,parseInt(v)||0));if(n)back.push(l.brand+" "+l.color+" × "+n);if(l.q-n>0){const x={...l,q:l.q-n};if(l.pe!=null)x.pe=Math.round(l.pe/l.q*(l.q-n));nl.push(x)}}
  if(!back.length)return;
  const {error}=await sb.from("orders").update({lines:nl,items:nl.length?nl.map(x=>x.brand+" "+x.color+" × "+x.q).join("، "):"— كل القطع رجعت",notes:((o.notes||"")+"\nمرتجع جزئي: "+back.join("، ")).trim()}).eq("id",id);

async function importSheet(file){

  let pc=-1,nc=-1,hr=-1;
  for(let i=0;i<Math.min(rows.length,10)&&pc<0;i++)rows[i].forEach((c,j)=>{if(pc<0&&/(تليفون|موبايل|هاتف|رقم|phone|mobile|tel|whats)/i.test(String(c))){pc=j;hr=i}});

    const {error}=await sb.rpc("seller_request_payout",{p_amount:a,p_method:m,p_account:ac});SL.msg=error?error.message:"";if(!error)alert("تم إرسال طلب السحب");await slLoad();slRender()});
  on("#stm",()=>{const w=SL.wal,KL={commission:"عمولة",reversal:"تعديل عمولة",payout:"تحويل",adjust:"تسوية"},wn=window.open("","_blank");if(!wn)return alert("اسمحي بالنوافذ المنبثقة");
    wn.document.write(`<!DOCTYPE html><html dir="rtl"><meta charset="utf-8"><title>كشف حساب</title><style>body{font:14px Tahoma,Arial;margin:20px}table{border-collapse:collapse;width:100%}td,th{border:1px solid #999;padding:6px;text-align:center}</style><h2>Classy Eyes — كشف حساب ${esc(S.name)}</h2><p>بتاريخ ${esc(today())} · المتاح ${money(w.available)} ج.م · قيد الانتظار ${money(w.pending)} ج.م · إجمالي الأرباح ${money(w.earned)} ج.م · اتحوّل ${money(w.paid)} ج.م</p><table><tr><th>التاريخ</th><th>النوع</th><th>البيان</th><th>المبلغ</th><th>يتاح في</th></tr>${(w.ledger||[]).map(l=>`<tr><td>${esc(String(l.created_at).slice(0,10))}</td><td>${KL[l.kind]||""}</td><td>${esc(l.note)}</td><td>${money(l.amount)}</td><td>${esc(String(l.available_at).slice(0,10))}</td></tr>`).join("")}</table><script>setTimeout(()=>print(),300)<\/script></html>`);wn.document.close()});
  const q=$("#slq");if(q)q.oninput=()=>{SL.q=q.value.trim();slRender();const n=$("#slq");n.focus();n.setSelectionRange(n.value.length,n.value.length)};
  const rd=()=>{SL.f=SL.f||{};["price","customer","phone","zone","address","notes"].forEach(k=>{const e=$("#sf_"+k);if(e)SL.f[k]=e.value})};
  const pr=$("#sf_price");if(pr)pr.oninput=()=>{rd();const cost=slCart().reduce((a,x)=>a+x.price*x.q,0),need=slCart().reduce((a,x)=>a+Math.max(x.min!=null?x.min:x.price,x.price)*x.q,0),p=Number(pr.value)||0,e=$("#slprofit");e.textContent=p?money(p-cost)+" ج.م":"—";e.style.color=p>=need?"#12284A":"#8A3F0A"};
  const z=$("#sf_zone");if(z)z.onchange=()=>{rd();slRender()};
  const sd=$("#slsend");if(sd)sd.onclick=async()=>{
    rd();const v=SL.f,it=slCart(),cost=it.reduce((a,x)=>a+x.price*x.q,0);
    if(!v.customer||!v.phone||!v.address||!v.zone){SL.msg="كمّلي الاسم والتليفون والمنطقة والعنوان";return slRender()}
    const need=it.reduce((a,x)=>a+Math.max(x.min!=null?x.min:x.price,x.price)*x.q,0);if(!(Number(v.price)>=need)){SL.msg="سعر البيع لازم يكون على الأقل "+money(need)+" ج.م";return slRender()}
    SL.busy=true;SL.msg="";slRender();
    const {error}=await sb.rpc("seller_create_order",{p_customer:v.customer,p_phone:normPhone(v.phone),p_address:v.address,p_zone:v.zone,p_notes:v.notes||"",p_price:Number(v.price),p_lines:it.map(x=>({sid:x.sid,q:x.q}))});
    SL.busy=false;
    if(error){SL.msg=error.message||"حصل خطأ، جرّبي تاني";await slLoad();return slRender()}
    SL.cart={};SL.f={};SL.done=SL.cat.review?"هيتراجع من الإدارة وبعدها يتجهّز.":"الأوردر وصل للإدارة وهيتجهّز.";await slLoad();slRender();
  };
}

/* ----- شاشة السيلرات للأدمن ----- */
async function loadSellers(){
  const [sp,st,pf,lg,or,as,ap,rq,bi]=await Promise.all([sb.from("seller_prices").select("*"),sb.from("stock").select("brand"),sb.from("profiles").select("id,name,role,phone").eq("role","seller").order("name"),fetchAll("seller_ledger"),fetchAll("orders",q=>q.not("seller_id","is",null)),sb.from("app_settings").select("*"),sb.from("profiles").select("id,name,phone,app_status").is("role",null).eq("app_status","pending"),fetchAll("payout_requests",q=>q.order("id",{ascending:false})),sb.from("brand_info").select("*")]);
  const set={};(as.data||[]).forEach(x=>set[x.key]=x.value);
  const brands=[...new Set([...(st.data||[]).map(x=>x.brand),...(sp.data||[]).map(x=>x.brand)])].sort();
  const pm={},mm={};(sp.data||[]).forEach(x=>{pm[x.brand]=x.price;mm[x.brand]=x.min_price});
  S.sl={brands,pm,mm,sellers:pf.data||[],ledger:lg,orders:or,set,apps:ap.data||[],reqs:rq,info:Object.fromEntries((bi.data||[]).map(x=>[x.brand,{img:x.image_path,post:x.post}]))};
}
function sellersView(){
  const d=S.sl||{brands:[],pm:{},sellers:[],ledger:[],orders:[],set:{},apps:[],reqs:[]},now=Date.now(),nm={};d.sellers.forEach(x=>nm[x.id]=x.name);
  const per=S.slper||"all",cut=per==="all"?"":new Date(Date.now()-Number(per)*864e5).toISOString().slice(0,10);
  const rr=d.sellers.map(x=>{const O=d.orders.filter(o=>o.seller_id===x.id&&(!cut||o.order_date>=cut)&&o.seller_review!=="rejected"),dl=O.filter(o=>o.status==="delivered").length,rt=O.filter(o=>["refused","partial"].includes(o.status)).length,cx=O.filter(o=>["cancelled","unavailable"].includes(o.status)).length,dn=dl+rt,com=d.ledger.filter(l=>l.seller_id===x.id&&["commission","reversal"].includes(l.kind)&&(!cut||String(l.created_at).slice(0,10)>=cut)).reduce((a,l)=>a+Number(l.amount),0);return {x,n:O.length,dl,rt,cx,dn,rate:dn?Math.round(rt/dn*100):0,com}}).sort((a,b)=>b.rate-a.rate);
  const reportUI=d.sellers.length?`<div class="card"><div class="hd"><b>تقرير السيلرات والمرتجعات</b><select id="slper" style="max-width:130px"><option value="all" ${per==="all"?"selected":""}>كل الفترة</option><option value="30" ${per==="30"?"selected":""}>آخر 30 يوم</option><option value="90" ${per==="90"?"selected":""}>آخر 90 يوم</option></select></div><div class="scroll"><table><tr><th>السيلر</th><th>أوردرات</th><th>مسلّم</th><th>رفض/جزئي</th><th>ملغي</th><th>نسبة المرتجع</th><th>العمولات</th></tr>${rr.map(r=>`<tr><td>${esc(r.x.name)}</td><td>${r.n}</td><td>${r.dl}</td><td>${r.rt}</td><td>${r.cx}</td><td style="${r.dn>=3&&r.rate>=30?"color:var(--er);font-weight:700":""}">${r.dn?r.rate+"%":"—"}</td><td>${money(r.com)}</td></tr>`).join("")}</table></div><div class="m">نسبة المرتجع = (رفض + جزئي) ÷ (مسلّم + رفض + جزئي). بتتلوّن بالأحمر لما توصل 30% أو أكتر (بعد 3 أوردرات منتهية على الأقل).</div></div>`:"";
  const paidL=(d.reqs||[]).filter(r=>r.status==="paid").slice(0,5),paidUI=paidL.length?`<div class="card"><b>آخر التحويلات</b>${paidL.map(r=>`<div class="row" style="flex-wrap:nowrap;align-items:center;margin-top:6px"><span style="flex:1">${esc(nm[r.seller_id]||"")} · ${money(r.amount)} ج.م <span class="m">${esc(String(r.handled_at||"").slice(0,10))}</span></span><button class="btn sec" style="margin:0;flex:0 0 auto" data-wp="${r.id}">📲 إبلاغها</button></div>`).join("")}</div>`:"";
  const tiersUI=`<div class="card"><b>مستويات السيلرات ومزاياها</b><p class="m">المستوى بيتحدد بعدد الأوردرات المسلّمة. «نسبة إضافية» بتتضاف على عمولة كل أوردر بعد بلوغ المستوى، و«مكافأة» مبلغ ثابت مرة واحدة عند بلوغه. الصفر = من غير ميزة.</p>${((d.set.tiers)||[]).map((t,i)=>`<div class="row" style="flex-wrap:nowrap;margin-bottom:6px"><input data-tn="${i}" value="${qa(t.name)}" placeholder="الاسم"><input type="number" data-tm="${i}" value="${t.min}" placeholder="من أوردر" ${i===0?"disabled":""}><input type="number" data-tp="${i}" value="${t.pct}" placeholder="%"><input type="number" data-tb="${i}" value="${t.bonus}" placeholder="مكافأة"></div>`).join("")}<div class="row m" style="flex-wrap:nowrap;font-size:11px"><span>الاسم</span><span>من أوردر مسلّم</span><span>نسبة إضافية %</span><span>مكافأة ج.م</span></div><button class="btn" id="tsave">حفظ المستويات</button><div class="m" id="tmsg"></div></div>`;
  const apps=(d.apps||[]).length?`<div class="card"><b>طلبات انضمام جديدة (${d.apps.length})</b>${d.apps.map(a=>`<div class="row" style="flex-wrap:nowrap;align-items:center;margin-top:8px"><span style="flex:1"><b>${esc(a.name)}</b><br><a href="https://wa.me/2${esc(a.phone)}" style="color:var(--pr)">${esc(a.phone)}</a></span><button class="btn" style="margin:0;flex:0 0 auto" data-ap="${a.id}">قبول</button><button class="btn sec" style="margin:0;flex:0 0 auto" data-ar="${a.id}">رفض</button></div>`).join("")}</div>`:"";
  const pend=(d.reqs||[]).filter(r=>r.status==="pending"),reqs=pend.length?`<div class="card"><b>طلبات سحب (${pend.length})</b>${pend.map(r=>`<div style="margin-top:8px;border-top:1px solid var(--bd);padding-top:8px"><b>${esc(nm[r.seller_id]||"")}</b> · ${money(r.amount)} ج.م<div class="m">${esc(r.method)}: ${esc(r.account)} · ${esc(String(r.created_at).slice(0,10))}</div><div class="row"><button class="btn" style="margin:6px 0 0" data-rp="${r.id}">تم التحويل</button><button class="btn sec" style="margin:6px 0 0" data-rr="${r.id}">رفض</button></div></div>`).join("")}</div>`:"";
  const sel=d.sellers.map(s=>{const L=d.ledger.filter(x=>x.seller_id===s.id),O=d.orders.filter(o=>o.seller_id===s.id);
    return `<div class="card"><div class="hd"><b>${esc(s.name)}</b><span class="m">${O.length} أوردر · ${O.filter(o=>o.status==="delivered").length} مسلّم</span></div><div class="stats" style="margin-top:8px"><div><b>${money(L.filter(x=>new Date(x.available_at)<=now).reduce((a,x)=>a+Number(x.amount),0))}</b>متاح</div><div><b>${money(L.filter(x=>new Date(x.available_at)>now).reduce((a,x)=>a+Number(x.amount),0))}</b>قيد الانتظار</div><div><b>${money(-L.filter(x=>x.kind==="payout").reduce((a,x)=>a+Number(x.amount),0))}</b>اتحوّل</div></div><div class="row"><input type="number" inputmode="decimal" placeholder="مبلغ التحويل" data-pa="${s.id}"><input placeholder="ملاحظة (اختياري)" data-pn="${s.id}"><button class="btn" style="margin:0" data-pay="${s.id}">تسجيل تحويل</button></div></div>`}).join("");
  return apps+reqs+paidUI+reportUI+`<div class="card"><b>إعدادات برنامج السيلرات</b><label style="display:flex;gap:8px;align-items:center;color:var(--tx)"><input type="checkbox" id="slrev" style="width:auto" ${d.set.seller_review===true?"checked":""}> مراجعة أوردرات السيلرات (مودريتور/أدمن) قبل ما تروح للتجهيز</label><label style="display:flex;gap:8px;align-items:center;color:var(--tx)"><input type="checkbox" id="slmin" style="width:auto" ${d.set.min_price_on===true?"checked":""}> تفعيل «الحد الأدنى لسعر البيع» (بتحدده لكل براند تحت). مقفول = السيلر تبيع بأي سعر فوق سعرها.</label><label>هدف الشهر للسيلرات: عدد الأوردرات المسلّمة في الشهر (0 = مقفول) ومكافأة ثابتة (ج.م) عند تحقيقه</label><div class="row"><input type="number" id="slgo" min="0" value="${Number((d.set.goal||{}).orders)||0}" placeholder="عدد الأوردرات"><input type="number" id="slgb" min="0" value="${Number((d.set.goal||{}).bonus)||0}" placeholder="المكافأة"></div><label>فترة الانتظار قبل ما العمولة تبقى متاحة (بالأيام)</label><div class="row"><input type="number" id="slhd" min="0" value="${Number(d.set.hold_days)||0}" style="max-width:120px"><button class="btn" id="slsave" style="margin:0">حفظ</button></div><label>مكافأة الإحالة (ج.م) — بتتدفع للسيلر اللي أحالت لما المُحالة تاخد أول عمولة. 0 = مقفولة</label><input type="number" id="slrb" min="0" value="${Number(d.set.ref_bonus)||0}" style="max-width:120px"><div class="m" id="slmsg2"></div></div>
  ${tiersUI}
  <div class="card"><b>أسعار السيلرات (سعر الجوز)</b><p class="m">الخانة الأولى (يمين) حد أدنى لسعر بيع الجوز للعميلة، والتانية سعر السيلر. السعر الفاضي = المنتج مش ظاهر للسيلرات، والحد الأدنى الفاضي = سعر السيلر نفسه. السعر بيتجمّد على الأوردر وقت تسجيله، فتعديله ما بيغيّرش الأوردرات القديمة.</p>${d.brands.map(b=>`<div class="row" style="flex-wrap:nowrap;margin-bottom:6px;align-items:center"><span style="flex:1">${esc(b)}</span><input type="number" inputmode="decimal" data-bm="${qa(b)}" value="${d.mm[b]==null?"":d.mm[b]}" placeholder="حد أدنى للبيع" style="max-width:120px"><input type="number" inputmode="decimal" data-bp="${qa(b)}" value="${d.pm[b]==null?"":d.pm[b]}" placeholder="غير متاح" style="max-width:130px"></div>`).join("")}<div class="m" id="slmsg3"></div></div>
  <div class="card"><b>صور ومنشورات البراندات</b><p class="m">الصور دلوقتي تجريبية (مولّدة تلقائي). ارفع صورة حقيقية لأي براند وهتظهر للسيلرات مكانها. اكتب منشور جاهز تنسخه السيلر.</p>${d.brands.map(b=>{const i=(d.info||{})[b]||{};return `<div style="border-top:1px solid var(--bd);padding-top:8px;margin-top:8px"><div class="row" style="flex-wrap:nowrap;align-items:center"><img src="${qa(brandImg(b,i))}" alt="" style="width:72px;height:54px;object-fit:cover;border-radius:8px;flex:0 0 72px"><b style="flex:1">${esc(b)}</b><label class="btn sec" style="margin:0;flex:0 0 auto;text-align:center">📷 صورة<input type="file" accept="image/*" hidden data-bimg="${qa(b)}"></label>${i.img?`<button class="btn sec" style="margin:0;flex:0 0 auto" data-bimgx="${qa(b)}">✖</button>`:""}</div><textarea data-bpst="${qa(b)}" placeholder="المنشور الجاهز للبراند ده" style="margin-top:6px">${esc(i.post||"")}</textarea></div>`}).join("")}</div>
  <div class="card"><b>السيلرات</b><p class="m">السيلرات بتسجّل بنفسها من صفحة الدخول (زر «سجّلي كسيلر جديدة») وطلبها بيظهر فوق للقبول أو الرفض.</p></div>${sel||'<div class="empty">مفيش سيلرات لسه</div>'}`;
}
function sellersBind(on){
  on("#slsave","click",async()=>{const m=$("#slmsg2"),a=await sb.from("app_settings").upsert({key:"seller_review",value:$("#slrev").checked}),b=await sb.from("app_settings").upsert([{key:"hold_days",value:Math.max(0,parseInt($("#slhd").value)||0)},{key:"ref_bonus",value:Math.max(0,Number($("#slrb").value)||0)},{key:"min_price_on",value:$("#slmin").checked},{key:"goal",value:{orders:Math.max(0,parseInt($("#slgo").value)||0),bonus:Math.max(0,Number($("#slgb").value)||0)}}]);m.textContent=a.error||b.error?"فشل الحفظ":"تم الحفظ"});
  on("[data-bp]","change",async e=>{const v=e.value.trim(),{error}=await sb.from("seller_prices").upsert({brand:e.dataset.bp,price:v===""?null:Number(v),updated_at:new Date().toISOString()});$("#slmsg3").textContent=error?"فشل حفظ السعر":"تم حفظ سعر "+e.dataset.bp});
  on("#slper","change",e=>{S.slper=e.value;render()});
  on("#tsave","click",async()=>{const t=((S.sl.set.tiers)||[]).map((x,i)=>({name:($(`[data-tn="${i}"]`).value||x.name).trim(),min:i===0?0:Math.max(0,parseInt($(`[data-tm="${i}"]`).value)||0),pct:Math.max(0,Number($(`[data-tp="${i}"]`).value)||0),bonus:Math.max(0,Number($(`[data-tb="${i}"]`).value)||0)}));
    for(let i=1;i<t.length;i++)if(t[i].min<=t[i-1].min)return alert("لازم كل مستوى يبدأ من عدد أكبر من اللي قبله");
    const {error}=await sb.from("app_settings").upsert({key:"tiers",value:t});$("#tmsg").textContent=error?"فشل الحفظ":"تم الحفظ";if(!error){S.sl.set.tiers=t}});
  on("[data-bm]","change",async e=>{const v=e.value.trim(),{error}=await sb.from("seller_prices").upsert({brand:e.dataset.bm,min_price:v===""?null:Number(v)});$("#slmsg3").textContent=error?"فشل حفظ الحد الأدنى":"تم حفظ الحد الأدنى لـ"+e.dataset.bm});
  on("[data-wp]","click",e=>{const r=(S.sl.reqs||[]).find(x=>x.id==e.dataset.wp),sl=S.sl.sellers.find(x=>x.id===r.seller_id);if(!sl||!sl.phone)return alert("مفيش رقم للسيلر");
    window.open("https://wa.me/"+waNum(sl.phone)+"?text="+encodeURIComponent(`أهلاً ${sl.name} 🌸\nتم تحويل ${r.amount} ج.م على ${r.method} (${r.account}) ✅\nشكرًا لشغلك مع Classy Eyes 💙`),"_blank")});
  on("[data-bimg]","change",async e=>{const f=e.files[0];if(!f)return;const path="b"+Date.now()+".jpg",{error}=await sb.storage.from("brand-images").upload(path,await shrink(f),{contentType:"image/jpeg"});if(error)return alert("فشل رفع الصورة");const r=await sb.from("brand_info").upsert({brand:e.dataset.bimg,image_path:path,updated_at:new Date().toISOString()});if(r.error)return alert("فشل الحفظ");await loadSellers();render()});
  on("[data-bimgx]","click",async e=>{if(!confirm("رجوع للصورة التجريبية؟"))return;await sb.from("brand_info").upsert({brand:e.dataset.bimgx,image_path:null});await loadSellers();render()});
  on("[data-bpst]","change",async e=>{const {error}=await sb.from("brand_info").upsert({brand:e.dataset.bpst,post:e.value,updated_at:new Date().toISOString()});$("#slmsg3").textContent=error?"فشل حفظ المنشور":"تم حفظ منشور "+e.dataset.bpst});
  on("[data-ap]","click",async e=>{const {error}=await sb.from("profiles").update({role:"seller",app_status:"approved"}).eq("id",e.dataset.ap);if(error)return alert("فشل القبول");await loadSellers();render()});
  on("[data-ar]","click",async e=>{if(!confirm("رفض الطلب؟"))return;const {error}=await sb.from("profiles").update({app_status:"rejected"}).eq("id",e.dataset.ar);if(error)return alert("فشل الرفض");await loadSellers();render()});
  on("[data-rp]","click",async e=>{if(!confirm("اتأكدت إنك حوّلت المبلغ؟"))return;const {error}=await sb.rpc("admin_handle_request",{p_id:Number(e.dataset.rp),p_action:"pay",p_note:""});if(error)return alert(error.message);await loadSellers();render()});
  on("[data-rr]","click",async e=>{const n=prompt("سبب الرفض (اختياري)");if(n===null)return;const {error}=await sb.rpc("admin_handle_request",{p_id:Number(e.dataset.rr),p_action:"reject",p_note:n});if(error)return alert(error.message);await loadSellers();render()});
  on("[data-pay]","click",async e=>{const id=e.dataset.pay,a=Number($(`[data-pa="${id}"]`).value),n=$(`[data-pn="${id}"]`).value;if(!(a>0))return alert("اكتب مبلغ صحيح");if(!confirm("تسجيل تحويل "+a+" ج.م؟"))return;const {error}=await sb.rpc("admin_payout",{p_seller:id,p_amount:a,p_note:n});if(error)return alert(error.message);await loadSellers();render()});
}
