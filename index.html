<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>سيستم الأوردرات</title>
<style>
:root{--bg:#f6f5f2;--card:#fff;--tx:#1f1f1f;--mut:#6b6b6b;--bd:#e2e0da;--pr:#7a3e8e;--prt:#fff;--ok:#1f8a4c;--wr:#b7791f;--er:#c0392b}
@media(prefers-color-scheme:dark){:root{--bg:#171517;--card:#242125;--tx:#efecef;--mut:#a29da3;--bd:#3a363b;--pr:#c58ad8;--prt:#1a1a1a;--ok:#4cc27d;--wr:#e0b04f;--er:#ec7b6e;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif}
main{max-width:760px;margin:0 auto;padding:12px}h1{font-size:18px;margin:4px 0}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
button,select,input,textarea{font:inherit;color:var(--tx)}
nav{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px}nav button{white-space:nowrap;padding:8px 14px;border:1px solid var(--bd);background:var(--card);border-radius:20px;cursor:pointer}nav button.on{background:var(--pr);color:var(--prt);border-color:var(--pr)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
label{display:block;font-size:13px;color:var(--mut);margin:8px 0 3px}input,select,textarea{width:100%;padding:9px;border:1px solid var(--bd);border-radius:8px;background:var(--bg)}textarea{min-height:64px}
.btn{padding:10px 16px;border:0;border-radius:8px;background:var(--pr);color:var(--prt);cursor:pointer;margin-top:10px}.btn.sec{background:transparent;color:var(--tx);border:1px solid var(--bd)}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1;min-width:120px}.hd{display:flex;justify-content:space-between;align-items:center;gap:8px}.no{font-weight:700;font-size:16px}
.bd{font-size:12px;padding:2px 10px;border-radius:12px;border:1px solid currentColor;white-space:nowrap}
.s-new,.s-preparing{color:var(--wr)}.s-shipped,.s-delivered{color:var(--ok)}.s-indelivery{color:var(--pr)}.s-unavailable,.s-refused,.s-cancelled{color:var(--er)}.s-partial{color:var(--pr)}
.m{color:var(--mut);font-size:13px}.note{background:var(--bg);border-radius:8px;padding:6px 9px;margin-top:6px;font-size:14px}
.ph{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.ph img{width:72px;height:72px;object-fit:cover;border-radius:8px;border:1px solid var(--bd);cursor:pointer}
.scroll{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px;white-space:nowrap}td,th{padding:6px 8px;border-bottom:1px solid var(--bd);text-align:center}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-bottom:10px}.stats div{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:8px;text-align:center}.stats b{display:block;font-size:20px}
.empty{text-align:center;color:var(--mut);padding:28px 0}
</style>

const FOOT=`<div class="m" style="text-align:center;margin:26px 0 14px">تابعنا على: <a href="https://www.facebook.com/share/14oDhG6Tgrw/" target="_blank" rel="noopener" style="color:var(--pr)">فيسبوك</a> · <a href="https://www.instagram.com/classyeyesofficial" target="_blank" rel="noopener" style="color:var(--pr)">إنستجرام</a> · <a href="https://www.tiktok.com/@classy.eyes" target="_blank" rel="noopener" style="color:var(--pr)">تيك توك</a></div>`;
const BRAND=`<div style="display:flex;align-items:center;gap:8px"><img src="${LOGO}" alt="" style="height:40px;background:#fff;border-radius:8px;padding:2px"><h1>Classy Eyes</h1></div>`;
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const S={user:null,role:null,orders:[],all:[],team:[],urls:{},contacts:[],sel:new Set(),cq:null,cf:"",cnote:"",cmsg:(()=>{try{return localStorage.getItem("cmsg")||""}catch(e){return ""}})()||"أهلاً {الاسم} 🌸\nعندنا في Classy Eyes عروض جديدة ✨\nلو حابة تعرفي التفاصيل ابعتيلنا هنا.",defs:[],defect:[],kan:[],newc:0,dash:[],files:[],tab:"home",date:today(),fstat:"",src:"",q:"",stock:[],sq:"",zones:[],late:[],lines:[],edit:null,rf:today(),rt:today()};
const $=s=>document.querySelector(s),A=()=>$("#app");
const esc=t=>{const d=document.createElement("div");d.textContent=t==null?"":String(t);return d.innerHTML};
const money=n=>(Number(n)||0).toLocaleString("ar-EG");

async function init(){
  const {data}=await sb.auth.getSession();
  if(!data.session)return loginView();
  S.user=data.session.user;
  const {data:p}=await sb.from("profiles").select("name,role").eq("id",S.user.id).single();
  S.role=p&&p.role;S.name=p&&p.name;
  await load();render();
}
function loginView(){
  A().className="";A().innerHTML=`<div class="card" style="max-width:360px;margin:40px auto">${BRAND}<label>اسم المستخدم</label><input id="u" autocapitalize="none" autocomplete="username"><label>الباسورد</label><input id="p" type="password" autocomplete="current-password"><button class="btn" id="go" style="width:100%">دخول</button><div class="m" id="msg"></div></div>${FOOT}`;
  const go=async()=>{const {error}=await sb.auth.signInWithPassword({email:$("#u").value.trim().toLowerCase()+DOMAIN,password:$("#p").value});if(error)$("#msg").textContent="تعذر الدخول: "+error.message;else init()};
  $("#go").onclick=go;$("#p").onkeydown=e=>{if(e.key==="Enter")go()};
}
async function signUrls(list){
  const need=list.flatMap(o=>[...(o.photos||[]),...(o.attachments||[])]).filter(p=>!S.urls[p]);if(!need.length)return;
  const {data}=await sb.storage.from("order-photos").createSignedUrls(need,3600);
  (data||[]).forEach(x=>{if(x.signedUrl)S.urls[x.path]=x.signedUrl});
}
async function load(){
  if(S.tab==="list"||S.tab==="new"){
    const qq=S.q.replace(/[,()%*]/g," ").trim();
    if(qq.length>=2){const {data}=await sb.from("orders").select("*").or(`customer.ilike.%${qq}%,phone.ilike.%${qq}%,waybill.ilike.%${qq}%`).order("order_date",{ascending:false}).order("no").limit(100);S.orders=data||[]}
    else{const {data}=await sb.from("orders").select("*").eq("order_date",S.date).order("no");S.orders=data||[]}
    await signUrls(S.orders)}
  if(S.role==="admin"||S.role==="mod"){const {data}=await sb.from("orders").select("id,no,order_date,customer,phone,zone,status_at,total,waybill").eq("status","indelivery").lte("status_at",new Date(Date.now()-5*864e5).toISOString()).order("status_at");S.late=data||[]}
  {const {count}=await sb.from("orders").select("id",{count:"exact",head:true}).eq("status","new");S.newc=count||0}
  if(S.tab==="home"){let all=[],from=0;const ms=today().slice(0,8)+"01";while(true){const {data}=await sb.from("orders").select("order_date,status,total,source,lines,kind").gte("order_date",ms).range(from,from+999);all=all.concat(data||[]);if(!data||data.length<1000)break;from+=1000}S.dash=all}
  if(S.tab==="kan"){const d7=new Date(Date.now()-7*864e5),ds=d7.getFullYear()+"-"+String(d7.getMonth()+1).padStart(2,"0")+"-"+String(d7.getDate()).padStart(2,"0");S.kan=await fetchAll("orders",q=>q.or("status.in.(new,preparing,shipped,indelivery),and(status.eq.delivered,order_date.gte."+ds+")").order("order_date").order("no"))}
  if(S.tab==="zones"||(S.tab==="new"&&!S.zones.length)){const {data}=await sb.from("ship_zones").select("*").order("sort");S.zones=data||[]}
  if(S.tab==="contacts"){S.contacts=await fetchAll("contacts",q=>q.order("created_at",{ascending:false}))}
  if(S.tab==="defect"){const {data}=await sb.from("defect_stock").select("*").order("brand").order("color");S.defect=data||[]}
  if(S.tab==="stock"||S.tab==="new"){const {data}=await sb.from("stock").select("*").order("brand").order("color");S.stock=data||[]}
  if(S.tab==="rep"){let all=[],from=0;while(true){const {data}=await sb.from("orders").select("*").gte("order_date",S.rf).lte("order_date",S.rt).range(from,from+999);all=all.concat(data||[]);if(!data||data.length<1000)break;from+=1000}S.all=all}

async function qnext(mark){
  const q=S.cq;if(mark){const c=S.contacts.find(x=>x.id===q.ids[q.i]);await sb.from("contacts").update({last_sent_at:new Date().toISOString(),sent_count:c.sent_count+1}).eq("id",c.id)}
  q.i++;if(q.i>=q.ids.length){S.cq=null;alert("خلص الطابور ✅")}await load();render();
}
function exportContactsCsv(){
  const rows=S.contacts.filter(c=>S.sel.has(c.id));if(!rows.length){alert("حدد عملاء الأول.");return}
  const csv="\uFEFFName,Given Name,Phone 1 - Type,Phone 1 - Value\n"+rows.map(c=>{const n=(c.name||"عميل "+c.phone.slice(-4)).replace(/[",\n]/g," ");return `"${n}","${n}",Mobile,+20${c.phone.slice(1)}`}).join("\n");
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));a.download="contacts.csv";a.click();
}
function stockView(){
  const r=S.role,can=r==="admin"||r==="mod",by={},q=x=>esc(x).replace(/"/g,"&quot;");
  S.stock.forEach(x=>(by[x.brand]=by[x.brand]||[]).push(x));
  let h=`<label>بحث في المخزون</label><input id="sq" placeholder="اسم البراند أو اللون"><div style="height:10px"></div>`;
  if(r==="admin")h+=`<div class="card"><b>إضافة صنف</b><div class="row"><input id="sb" placeholder="البراند"><input id="sc" placeholder="اللون"><input id="sn" type="number" inputmode="numeric" placeholder="الكمية"></div><button class="btn" id="sadd">إضافة</button><div class="m" id="smsg"></div></div>`;
  return h+(Object.keys(by).map(b=>`<div class="card" data-b><b>${esc(b)}</b>${by[b].map(x=>`<div class="hd" data-s="${q(x.brand+" "+x.color)}" style="margin-top:8px"><span ${x.qty<=0?'style="color:var(--er)"':""}>${esc(x.color)}</span><span>${can?`<input type="number" inputmode="numeric" style="width:90px" data-qty="${x.id}" value="${x.qty}">`:`<b>${x.qty}</b>`}${r==="admin"?` <button class="btn sec" style="margin:0;padding:4px 8px" data-sdel="${x.id}">✖</button>`:""}</span></div>`).join("")}</div>`).join("")||'<div class="empty">المخزون فاضي</div>');
}
function shrink(file){return new Promise(res=>{const im=new Image();im.onload=()=>{const k=Math.min(1,1000/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*k;c.height=im.height*k;c.getContext("2d").drawImage(im,0,0,c.width,c.height);c.toBlob(b=>res(b||file),"image/jpeg",.7)};im.onerror=()=>res(file);im.src=URL.createObjectURL(file)})}
function bind(){
  const on=(s,ev,fn)=>A().querySelectorAll(s).forEach(e=>e["on"+ev]=()=>fn(e)),re=async()=>{await load();render()};
  on("#fd","change",e=>{S.date=e.value;re()});on("#fs","change",e=>{S.fstat=e.value;render()});
  on("#fsrc","change",e=>{S.src=e.value;render()});
  on("#fq","change",e=>{S.q=e.value.trim();re()});
  on("#sq","input",e=>{const f=e.value.trim();A().querySelectorAll("[data-s]").forEach(r=>r.style.display=!f||r.dataset.s.includes(f)?"":"none");A().querySelectorAll("[data-b]").forEach(c=>c.style.display=[...c.querySelectorAll("[data-s]")].some(r=>r.style.display!=="none")?"":"none")});
  on("[data-qty]","change",async e=>{const {error}=await sb.from("stock").update({qty:Math.max(0,parseInt(e.value)||0)}).eq("id",e.dataset.qty);e.style.borderColor=error?"var(--er)":"var(--ok)";if(error)alert("فشل حفظ الكمية")});
  on("#sadd","click",async()=>{const g=i=>$(i).value.trim(),d={brand:g("#sb"),color:g("#sc"),qty:parseInt(g("#sn"))||0};if(!d.brand||!d.color){$("#smsg").textContent="البراند واللون مطلوبين.";return}const {error}=await sb.from("stock").insert(d);if(error){$("#smsg").textContent="تعذر الإضافة (ممكن الصنف موجود قبل كده).";return}re()});
  on("[data-sdel]","click",async e=>{if(confirm("حذف الصنف ده؟")){await sb.from("stock").delete().eq("id",e.dataset.sdel);re()}});
  on("#f_att","change",e=>{S.files=[...e.files]});
  on("[data-pr]","click",e=>printLabel(e.dataset.pr));
  on("[data-wa]","change",e=>{waSend(e.dataset.wa,e.value);e.value=""});
  on("#f_phone","change",e=>showHist(e.value));
  if($("#f_phone")&&$("#f_phone").value)showHist($("#f_phone").value);
  on("[data-mv]","change",e=>moveTo(e.dataset.mv,e.value));
  A().querySelectorAll("[data-card]").forEach(c=>{c.ondragstart=ev=>ev.dataTransfer.setData("text/plain",c.dataset.card)});
  A().querySelectorAll("[data-col]").forEach(c=>{c.ondragover=ev=>ev.preventDefault();c.ondrop=ev=>{ev.preventDefault();const id=ev.dataTransfer.getData("text/plain");if(id)moveTo(id,c.dataset.col)}});
  on("#xo","click",doExport);on("#xb","click",doBackup);
  on("[data-rt]","click",e=>returnPieces(e.dataset.rt));
  on("[data-lg]","click",e=>showLog(e.dataset.lg));
  on("#zq","input",e=>{const f=e.value.trim();A().querySelectorAll("[data-zs]").forEach(r=>r.style.display=!f||r.dataset.zs.includes(f)?"":"none")});
  on("[data-zn]","change",async e=>{const {error}=await sb.from("ship_zones").update({name:e.value.trim()}).eq("id",e.dataset.zn);e.style.borderColor=error?"var(--er)":"var(--ok)"});
  on("[data-zf]","change",async e=>{const {error}=await sb.from("ship_zones").update({fee:Number(e.value)||0}).eq("id",e.dataset.zf);e.style.borderColor=error?"var(--er)":"var(--ok)"});
  on("[data-zd]","click",async e=>{if(confirm("حذف المنطقة دي؟")){await sb.from("ship_zones").delete().eq("id",e.dataset.zd);re()}});
  on("#zadd","click",async()=>{const n=$("#zan").value.trim(),f=Number($("#zaf").value);if(!n||$("#zaf").value===""||!(f>=0)){$("#zmsg").textContent="اكتب الاسم والسعر.";return}const {error}=await sb.from("ship_zones").insert({name:n,fee:f,sort:999});if(error){$("#zmsg").textContent="تعذر الإضافة (الاسم ممكن يكون موجود).";return}re()});
  on("[data-dq]","change",async e=>{const {error}=await sb.from("defect_stock").update({qty:Math.max(0,parseInt(e.value)||0)}).eq("id",e.dataset.dq);e.style.borderColor=error?"var(--er)":"var(--ok)"});
  on("#cmsg","input",e=>{S.cmsg=e.value;try{localStorage.setItem("cmsg",e.value)}catch(x){}});
  on("#cs","change",e=>{S.cf=e.value;render()});
  on("[data-cc]","change",e=>{const id=Number(e.dataset.cc);e.checked?S.sel.add(id):S.sel.delete(id);ccount()});
  on("#call","change",e=>{A().querySelectorAll("[data-cc]:not([disabled])").forEach(x=>{const id=Number(x.dataset.cc);x.checked=e.checked;e.checked?S.sel.add(id):S.sel.delete(id)});ccount()});
  ccount();
  on("[data-co]","click",async e=>{const c=S.contacts.find(x=>x.id==e.dataset.co);await sb.from("contacts").update({opted_out:!c.opted_out}).eq("id",c.id);S.sel.delete(c.id);await load();render()});
  on("#cf","change",async e=>{const f=e.files[0];if(!f)return;S.cnote="جاري القراءة...";try{S.cnote=await importSheet(f)}catch(x){S.cnote="تعذر الاستيراد: "+(x.message||"")}render()});
  on("#cimp","click",async()=>{try{S.cnote=await importFromOrders()}catch(x){S.cnote="تعذر الاستيراد: "+(x.message||"")}render()});
  on("#cstart","click",()=>{const ids=[...S.sel].filter(id=>S.contacts.some(c=>c.id===id&&!c.opted_out));if(!ids.length||!S.cmsg.trim()){alert("حدد عميلات واكتب الرسالة الأول.");return}S.cq={ids,i:0};render()});
  on("#cexp","click",exportContactsCsv);
  on("#cdel","click",async()=>{const ids=[...S.sel];if(!ids.length||!confirm("حذف "+ids.length+" عميل من القايمة؟"))return;for(let i=0;i<ids.length;i+=100)await sb.from("contacts").delete().in("id",ids.slice(i,i+100));S.sel.clear();await load();render()});
  on("#qopen","click",()=>{const c=S.contacts.find(x=>x.id===S.cq.ids[S.cq.i]);window.open("https://wa.me/"+waNum(c.phone)+"?text="+encodeURIComponent(msgFor(c)),"_blank")});
  on("#qdone","click",()=>qnext(true));on("#qskip","click",()=>qnext(false));on("#qstop","click",()=>{S.cq=null;render()});
  on("[data-wb]","change",async e=>{const {error}=await sb.from("orders").update({waybill:e.value.trim()}).eq("id",e.dataset.wb);e.style.borderColor=error?"var(--er)":"var(--ok)"});
  on("[data-trk]","click",e=>trackWb(e.dataset.trk));
  on("#addline","click",()=>{S.lines.push({brand:"",sid:0,color:"",q:1});drawLines()});
  on("#f_zone","input",e=>{const z=S.zones.find(z=>z.name===e.value.trim());if(z&&!$("#f_rep").checked)$("#f_fee").value=z.fee;calc()});
  on("#f_fee","input",calc);on("#f_price","input",calc);
  if($("#lines")){drawLines();togRep()}
  on("#f_rep","change",togRep);on("#adddef","click",()=>{S.defs.push({brand:"",sid:0,color:"",q:1});drawLines("defs")});
  on("#rf","change",e=>{S.rf=e.value;re()});on("#rt","change",e=>{S.rt=e.value;re()});
  on("#cancel","click",()=>{S.edit=null;S.tab="list";re()});
  on("#save","click",async b=>{
    const g=k=>$("#f_"+k).value.trim(),d={customer:g("customer"),phone:normPhone(g("phone")),address:g("address"),profile_name:g("profile"),source:g("source"),items:S.lines.length?S.lines.map(l=>l.brand+" "+l.color+" × "+l.q).join("، "):((S.edit&&(S.orders.find(x=>x.id===S.edit)||{}).items)||""),lines:S.lines.map(l=>({sid:l.sid,brand:l.brand,color:l.color,q:l.q})),zone:g("zone"),ship_fee:Number(g("fee"))||0,price:$("#f_rep").checked?0:(Number(g("price"))||0),kind:$("#f_rep").checked?"replacement":"normal",ref_order:$("#f_ref").value.trim(),defect_lines:$("#f_rep").checked?S.defs.map(l=>({sid:l.sid,brand:l.brand,color:l.color,q:l.q})):[],notes:g("notes")},msg=$("#msg");
    if(!d.customer||!d.phone||!d.items||!d.source){msg.textContent="الاسم والتليفون والمحتويات ومصدر الأوردر مطلوبين.";return}
    if(S.lines.some(l=>!l.sid||!(l.q>=1))){msg.textContent="كمّل البراند واللون والعدد لكل صنف.";return}
    if($("#f_rep").checked&&(!S.defs.length||S.defs.some(l=>!l.sid||!(l.q>=1)))){msg.textContent="حدد العدسات التالفة (براند ولون وعدد).";return}
    const need={};S.lines.forEach(l=>need[l.sid]=(need[l.sid]||0)+l.q);
    for(const k in need){if(need[k]>avail(k)){const st=S.stock.find(x=>x.id==k);msg.textContent="الكمية غير متوفرة بالمخزون: "+st.brand+" "+st.color+" (المتاح "+avail(k)+")";return}}
    b.disabled=true;
    const eo=S.edit?S.orders.find(x=>x.id===S.edit):null,paths=[];
    for(const f of S.files){const path="att/"+Date.now()+"-"+Math.random().toString(36).slice(2,8)+".jpg";const {error:ue}=await sb.storage.from("order-photos").upload(path,await shrink(f),{contentType:"image/jpeg"});if(ue){msg.textContent="فشل رفع الصورة، حاول تاني.";b.disabled=false;return}paths.push(path)}
    d.attachments=[...((eo&&eo.attachments)||[]),...paths];
    const {error}=S.edit?await sb.from("orders").update(d).eq("id",S.edit):await sb.from("orders").insert(d);
    if(error){msg.textContent=error.message.includes("الكمية")?error.message:"تعذر الحفظ، حاول تاني.";b.disabled=false;return}
    if(!S.edit)S.date=today();S.edit=null;S.files=[];S.tab="list";re();
  });
  on("[data-ed]","click",async e=>{S.edit=Number(e.dataset.ed);const o=S.orders.find(x=>x.id===S.edit)||{};S.lines=(o.lines||[]).map(x=>({...x}));S.defs=(o.defect_lines||[]).map(x=>({...x}));S.files=[];S.tab="new";await load();render()});
  on("[data-cx]","click",async e=>{if(confirm("تأكيد إلغاء الأوردر؟")){await sb.from("orders").update({status:"cancelled"}).eq("id",e.dataset.cx);re()}});
  on("[data-sv]","click",async e=>{const id=e.dataset.sv,{error}=await sb.from("orders").update({status:A().querySelector(`[data-st="${id}"]`).value,ship_note:A().querySelector(`[data-sn="${id}"]`).value.trim()}).eq("id",id);e.textContent=error?(error.message.includes("الكمية")?"الكمية غير متوفرة":"فشل الحفظ"):"تم ✓"});
  on("[data-up]","change",async e=>{
    const f=e.files[0];if(!f)return;const id=Number(e.dataset.up),lab=e.parentElement;lab.firstChild.textContent="⏳ جاري الرفع...";
    const path=id+"/"+Date.now()+".jpg",{error}=await sb.storage.from("order-photos").upload(path,await shrink(f),{contentType:"image/jpeg"});
    if(error){alert("فشل رفع الصورة.");lab.firstChild.textContent="📷 رفع صورة";return}
    const o=S.orders.find(x=>x.id===id);await sb.from("orders").update({photos:[...(o.photos||[]),path]}).eq("id",id);re();
  });
  on("[data-ph]","click",e=>window.open(e.src,"_blank"));
  on("[data-role]","change",async e=>{const {error}=await sb.from("profiles").update({role:e.value||null}).eq("id",e.dataset.role);if(error)alert("فشل حفظ الصلاحية")});
}
setInterval(()=>{const a=document.activeElement;if(S.user&&(S.tab==="kan"||S.tab==="home"||S.tab==="list"||S.tab==="stock"||S.tab==="late")&&!(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)))load().then(render)},30000);
init();
</script>
