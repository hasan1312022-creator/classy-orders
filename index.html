<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>سيستم الأوردرات</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F4F6FA;--card:#fff;--tx:#0F1B30;--mut:#5A6B85;--bd:#E1E6EF;--pr:#12284A;--prt:#fff;--ok:#1E7B4A;--wr:#B7791F;--er:#C0392B;--soft:#EAEFF7;--ff:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif}
@media(prefers-color-scheme:dark){:root{--bg:#0E1424;--card:#151D33;--tx:#E7ECF6;--mut:#9AA8CC;--bd:#26335A;--pr:#7FB0FF;--prt:#0B1220;--ok:#4cc27d;--wr:#e0b04f;--er:#ec7b6e;--soft:#1B2644;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 var(--ff)}
main{max-width:760px;margin:0 auto;padding:12px}h1{font-size:18px;margin:4px 0}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
button,select,input,textarea{font:inherit;color:var(--tx)}
nav{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px}nav button{white-space:nowrap;padding:8px 14px;border:1px solid var(--bd);background:var(--card);border-radius:20px;cursor:pointer}nav button.on{background:var(--pr);color:var(--prt);border-color:var(--pr)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
label{display:block;font-size:13px;color:var(--mut);margin:8px 0 3px}input,select,textarea{width:100%;padding:9px;border:1px solid var(--bd);border-radius:8px;background:var(--bg)}textarea{min-height:64px}
.btn{padding:10px 16px;border:0;border-radius:8px;background:var(--pr);color:var(--prt);cursor:pointer;margin-top:10px}.btn.sec{background:transparent;color:var(--tx);border:1px solid var(--bd)}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1;min-width:120px}.hd{display:flex;justify-content:space-between;align-items:center;gap:8px}.no{font-weight:700;font-size:16px}
.bd{font-size:12px;padding:2px 10px;border-radius:12px;border:1px solid currentColor;white-space:nowrap}
.s-new,.s-preparing{color:var(--wr)}.s-shipped,.s-delivered{color:var(--ok)}.s-indelivery{color:var(--pr)}.s-unavailable,.s-refused,.s-cancelled{color:var(--er)}.s-partial{color:var(--pr)}
.m{color:var(--mut);font-size:13px}.note{background:var(--bg);border-radius:8px;padding:6px 9px;margin-top:6px;font-size:14px}
.ph{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.ph img{width:72px;height:72px;object-fit:cover;border-radius:8px;border:1px solid var(--bd);cursor:pointer}
.scroll{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px;white-space:nowrap}td,th{padding:6px 8px;border-bottom:1px solid var(--bd);text-align:center}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-bottom:10px}.stats div{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:8px;text-align:center}.stats b{display:block;font-size:20px}
.empty{text-align:center;color:var(--mut);padding:28px 0}
/* ===== Iris: الهوية والتنقل ===== */
button,select,input,textarea{font-family:inherit}
.card{border-radius:16px;box-shadow:0 1px 2px rgba(15,27,48,.04)}.btn{border-radius:10px;font-weight:600}
input,select,textarea{border-radius:10px}.stats div{border-radius:14px;padding:12px 8px}.stats b{font-size:22px}
.bd{font-weight:600}
.lsw{display:inline-block;width:var(--s,24px);height:var(--s,24px);border-radius:50%;flex:none;vertical-align:middle;box-shadow:0 0 0 1px rgba(15,27,48,.18)}
.lsr{display:inline-flex;direction:ltr;vertical-align:middle;margin-inline-end:6px}.lsr .lsw{margin-inline-start:-6px;box-shadow:0 0 0 2px var(--card),0 0 0 3px rgba(15,27,48,.14)}.lsr .lsw:first-child{margin-inline-start:0}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.bdg{background:#D63B3B;color:#fff;border-radius:10px;font-size:11px;font-weight:600;padding:0 7px;line-height:18px;min-width:18px;text-align:center;font-style:normal}
body.adm main{max-width:none;padding:0}
.shell{display:flex;min-height:100vh}.mainc{flex:1;min-width:0;display:flex;flex-direction:column}
.sbar{display:none}.cnt{padding:12px 12px 96px;width:100%;max-width:1040px;margin:0 auto}
.tbar{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--card);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:20}
.mhd{display:flex;align-items:center;gap:8px;flex:1;min-width:0}.mhd img{height:34px;background:#fff;border-radius:8px;padding:2px}.mhd b{font-size:16px}
.crumb{display:none;flex:1;font-size:13px;color:var(--mut)}.crumb b{color:var(--tx)}.crumb span{margin:0 6px}
.srch{display:flex;align-items:center;gap:8px;min-height:40px;min-width:40px;justify-content:center;padding:0 12px;border:1px solid var(--bd);background:var(--bg);color:var(--mut);border-radius:10px;cursor:pointer;font-size:13px}
.srch span,.srch kbd{display:none}.srch kbd{font:11px/1 var(--ff);border:1px solid var(--bd);border-radius:5px;padding:2px 5px;background:var(--card)}
.nb{margin:0;display:none;align-items:center}.gh{border:1px solid var(--bd);background:transparent;color:var(--mut);border-radius:10px;min-height:40px;padding:0 12px;cursor:pointer}
.subs{display:flex;gap:6px;overflow-x:auto;padding:8px 12px 0;scrollbar-width:none}.subs button{flex:none;white-space:nowrap;min-height:40px;padding:0 14px;border-radius:20px;border:1px solid var(--bd);background:var(--card);color:var(--tx);cursor:pointer;display:flex;align-items:center;gap:6px}.subs button.on{background:var(--pr);color:var(--prt);border-color:var(--pr);font-weight:600}
.bnav{position:fixed;bottom:0;right:0;left:0;z-index:30;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--card);border-top:1px solid var(--bd);padding:4px 4px calc(6px + env(safe-area-inset-bottom))}
.bnav button{position:relative;border:0;background:none;color:var(--mut);min-height:50px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:500;cursor:pointer;border-radius:12px}
.bnav button.on{color:var(--pr);font-weight:700}.bnav .bdg{position:absolute;top:2px;inset-inline-start:calc(50% + 6px)}
#cmk{position:fixed;inset:0;background:rgba(8,14,28,.55);z-index:90;display:flex;align-items:flex-start;justify-content:center;padding:70px 12px}
.cmb{width:100%;max-width:560px;background:var(--card);border:1px solid var(--bd);border-radius:18px;box-shadow:0 30px 80px rgba(0,0,0,.4);overflow:hidden}
.cmb input{border:0;border-bottom:1px solid var(--bd);border-radius:0;padding:16px 18px;font-size:16px;background:transparent}
.cmb button{display:flex;width:100%;justify-content:space-between;align-items:center;border:0;background:none;color:var(--tx);padding:12px 18px;cursor:pointer;font-size:15px;text-align:start}.cmb button.on,.cmb button:hover{background:var(--soft)}.cmb em{font-style:normal;color:var(--mut);font-size:12px}
#cml{max-height:50vh;overflow:auto;padding:6px 0}
.siteframe{width:100%;height:calc(100vh - 210px);min-height:480px;border:0;border-radius:12px;background:#fff}
@media(min-width:900px){
  .sbar{display:flex;flex-direction:column;gap:2px;width:248px;flex:none;position:sticky;top:0;height:100vh;overflow:auto;background:var(--card);border-inline-end:1px solid var(--bd);padding:18px 12px;box-sizing:border-box}
  .sbr{display:flex;align-items:center;gap:10px;padding:0 6px 16px}.sbr img{height:42px;background:#fff;border-radius:10px;padding:2px}.sbr b{display:block;font-size:16px;line-height:1.2}.sbr span{font-size:12px;color:var(--mut)}
  .sg{margin-top:4px}.sgh{display:flex;align-items:center;gap:10px;width:100%;min-height:42px;padding:0 10px;border:0;background:none;color:var(--tx);border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;text-align:start}.sgh span{flex:1}.sgh:hover{background:var(--soft)}.sgh.on{background:var(--pr);color:var(--prt)}
  .sgi{display:flex;align-items:center;width:calc(100% - 18px);margin-inline-start:18px;min-height:38px;padding:0 12px;border:0;border-inline-start:2px solid var(--bd);background:none;color:var(--mut);font-size:13px;cursor:pointer;text-align:start;border-radius:0}.sgi span{flex:1}.sgi:hover{color:var(--tx)}.sgi.on{color:var(--tx);font-weight:700;border-inline-start-color:var(--pr)}
  .sbu{margin-top:auto;display:flex;align-items:center;gap:10px;padding:12px 6px 0;border-top:1px solid var(--bd)}.sbu>div:nth-child(2){flex:1;line-height:1.2}.sbu b{display:block;font-size:13px}.sbu span{font-size:12px;color:var(--mut)}
  .av{width:34px;height:34px;border-radius:50%;background:var(--soft);color:var(--pr);display:flex;align-items:center;justify-content:center;font-weight:700}
  .mhd,.subs,.bnav,.mlo{display:none}.crumb{display:block}.srch{width:300px;justify-content:flex-start}.srch span,.srch kbd{display:inline}.srch span{flex:1;text-align:start}.nb{display:flex}
  .tbar{padding:12px 28px}.cnt{padding:22px 28px 40px}.siteframe{height:calc(100vh - 140px)}
  .stats{grid-template-columns:repeat(auto-fit,minmax(128px,1fr))}
}

#tbk{position:fixed;inset:0;z-index:9990;background:transparent}
#thl{position:fixed;z-index:9991;border-radius:12px;box-shadow:0 0 0 9999px rgba(8,14,28,.72),0 0 0 3px #fff;pointer-events:none;transition:top .25s,left .25s,width .25s,height .25s}
#thl.full{box-shadow:0 0 0 9999px rgba(8,14,28,.72);border-radius:0;width:0!important;height:0!important}
#tcd{position:fixed;z-index:9992;width:min(340px,calc(100vw - 24px));background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:14px;padding:14px 14px 12px;box-shadow:0 12px 40px rgba(0,0,0,.35);line-height:1.6}
#tcd b.tt{display:block;font-size:16px;margin-bottom:4px}#tcd p{margin:0 0 10px;font-size:14px;color:var(--tx)}
#tcd .tn{display:flex;align-items:center;gap:6px}#tcd .tn .sp{flex:1}
#tcd .dots{display:flex;gap:4px;margin-bottom:10px}#tcd .dots i{width:7px;height:7px;border-radius:50%;background:var(--bd)}#tcd .dots i.on{background:var(--pr);width:18px;border-radius:4px}
#tcd .tskip{background:none;border:0;color:var(--mut);cursor:pointer;font-size:13px;padding:6px}
#tcd .ar{position:absolute;width:14px;height:14px;background:var(--card);border:1px solid var(--bd);transform:rotate(45deg)}
#tcd .ar.up{top:-8px;border-right:0;border-bottom:0}#tcd .ar.dn{bottom:-8px;border-left:0;border-top:0}

.pdn{border-color:#E08A00!important;box-shadow:0 0 0 2px rgba(224,138,0,.35)!important}
#pbar{position:fixed;z-index:9000;right:12px;left:12px;bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--card);color:var(--tx);border:2px solid #E08A00;border-radius:14px;padding:10px 12px;box-shadow:0 10px 34px rgba(0,0,0,.3)}
#pbar b{display:block;margin-bottom:2px}#pbar .pl{font-size:12px;color:var(--mut);margin-bottom:8px;max-height:70px;overflow:auto}#pbar .pr{display:flex;gap:8px}#pbar .pr .btn{margin:0;flex:1}
#pbar.fl{animation:pfl .5s 2}@keyframes pfl{50%{transform:scale(1.03);background:#FFF3DC;color:#222}}
@media(min-width:900px){#pbar{bottom:16px;left:auto;right:calc(50% - 280px);width:560px}}
</style>

function lensCol(n){n=String(n||"");for(const x of LCOL)if(x[0].test(n))return x[1];let h=0;for(const c of n)h=(h*31+c.charCodeAt(0))%360;return["hsl("+h+",42%,34%)","hsl("+h+",50%,68%)"]}
const lensBg=n=>{const c=lensCol(n);return"radial-gradient(circle,#0A0A0A 0 16%,transparent 17%),radial-gradient(circle,transparent 56%,rgba(0,0,0,.5) 100%),repeating-conic-gradient("+c[0]+" 0 4deg,"+c[1]+" 4deg 8deg)"};
const lensSw=(n,s)=>`<span class="lsw" style="--s:${s||24}px;background:${lensBg(n)}" aria-hidden="true"></span>`;
const lensRow=(ls,s)=>{const u=[],seen={};(ls||[]).forEach(l=>{if(l&&l.color&&!seen[l.color+l.brand]){seen[l.color+l.brand]=1;u.push(l)}});return u.length?`<span class="lsr">${u.slice(0,4).map(l=>lensSw(l.color,s||22)).join("")}</span>`:""};


async function init(){
  const {data}=await sb.auth.getSession();
  if(!data.session)return new URLSearchParams(location.search).get("signup")?signupView():loginView();
  S.user=data.session.user;
  const {data:p}=await sb.from("profiles").select("name,role,app_status").eq("id",S.user.id).single();
  S.role=p&&p.role;S.name=p&&p.name;S.app=p&&p.app_status;
  if(S.role&&S.role!=="admin"){const {data:pm}=await sb.rpc("my_perms");S.perms=Array.isArray(pm)?pm:[]}
  if(S.role==="seller")return sellerApp();
  await load();render();
}

  const {data}=await sb.storage.from("order-photos").createSignedUrls(need,3600);

}

async function importSheet(file){
  await xl();const wb=XLSX.read(await file.arrayBuffer()),rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:false,defval:""});
  let pc=-1,nc=-1,hr=-1;
  for(let i=0;i<Math.min(rows.length,10)&&pc<0;i++)rows[i].forEach((c,j)=>{if(pc<0&&/(تليفون|موبايل|هاتف|رقم|phone|mobile|tel|whats)/i.test(String(c))){pc=j;hr=i}});

  if(pc<0){const cnt={};rows.forEach(r=>r.forEach((c,j)=>{if(/^01[0-25]\d{8}$/.test(normPhone(c)))cnt[j]=(cnt[j]||0)+1}));const b=Object.entries(cnt).sort((a,b)=>b[1]-a[1])[0];if(b)pc=+b[0]}

const impNum=v=>{const s=String(v==null?"":v).replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/[۰-۹]/g,d=>"۰۱۲۳۴۵۶۷۸۹".indexOf(d)).replace(/[,٬\s]/g,"");if(s==="")return 0;return /^\d+(\.0+)?$/.test(s)?parseInt(s,10):NaN};
function impParse(rows){
  rows=rows.map((r,i)=>({r,n:i+1})).filter(x=>x.r.some(c=>String(c).trim()!==""));
  let bi=0,ci=1,qi=2,hdr=false,start=0;

  const map=new Map(),bad=[];let dup=0,last="";
  rows.slice(start).forEach(({r,n})=>{
    let b=String(r[bi]==null?"":r[bi]).trim().replace(/\s+/g," "),c=String(r[ci]==null?"":r[ci]).trim().replace(/\s+/g," ");

    if(b===""){bad.push({n,why:"البراند فاضي"});return}
    const q=qi>=0?impNum(r[qi]):0;
    if(isNaN(q)){bad.push({n,why:"الكمية مش رقم ("+String(r[qi]).slice(0,12)+")"});return}

async function impApply(){

    <button class="btn" data-ssv="${s.id}" style="margin-top:8px">حفظ التخصيص (خصم/مكافأة/هدف)</button><div class="m" data-ssm="${s.id}"></div><div class="m" style="font-size:12px">الأسعار الخاصة بتتحفظ أول ما تكتب الرقم. الخصم والمكافأة والهدف بالزرار.</div></div>`};
  const sel=d.sellers.map(s=>{const L=d.ledger.filter(x=>x.seller_id===s.id),O=d.orders.filter(o=>o.seller_id===s.id);
    return `<div class="card"><div class="hd"><b>${esc(s.name)}</b><span class="m">${O.length} أوردر · ${O.filter(o=>o.status==="delivered").length} مسلّم</span></div><div class="stats" style="margin-top:8px"><div><b>${money(L.filter(x=>new Date(x.available_at)<=now).reduce((a,x)=>a+Number(x.amount),0))}</b>متاح</div><div><b>${money(L.filter(x=>new Date(x.available_at)>now).reduce((a,x)=>a+Number(x.amount),0))}</b>قيد الانتظار</div><div><b>${money(-L.filter(x=>x.kind==="payout").reduce((a,x)=>a+Number(x.amount),0))}</b>اتحوّل</div></div><div class="row"><input type="number" inputmode="decimal" placeholder="مبلغ التحويل" data-pa="${s.id}"><input placeholder="ملاحظة (اختياري)" data-pn="${s.id}"></div><div class="row"><label class="btn sec" style="margin:0">📷 صورة التحويل<input type="file" accept="image/*" hidden data-pfi="${s.id}"></label><button class="btn" style="margin:0" data-pay="${s.id}">تسجيل تحويل</button></div><div class="row" style="margin-top:8px;align-items:center"><span class="m" style="flex:0 0 auto">رصيد افتتاحي</span><input type="number" inputmode="decimal" data-obv="${s.id}" value="${ob(s.id)}" placeholder="موجب ليها / سالب عليها" style="max-width:150px"><button class="btn sec" style="margin:0" data-obs="${s.id}">حفظ</button></div><div class="m" style="font-size:12px">الرصيد الافتتاحي بيدخل في المتاح: الموجب ليها، والسالب بيتخصم من عمولاتها الجاية قبل ما تسحب.</div><button class="btn sec" data-so="${s.id}" style="margin-top:8px">${(S.slopen||{})[s.id]?"إخفاء التخصيص":"⚙️ تخصيص السيلر دي (أسعار وعروض وحوافز)"}</button>${(S.slopen||{})[s.id]?custUI(s):""}</div>`}).join("");
  return joinUI+apps+reqs+paidUI+reportUI+`<div class="card"><b>إعدادات برنامج السيلرات</b><label style="display:flex;gap:8px;align-items:center;color:var(--tx)"><input type="checkbox" id="slrev" style="width:auto" ${d.set.seller_review===true?"checked":""}> مراجعة أوردرات السيلرات (مودريتور/أدمن) قبل ما تروح للتجهيز</label><label style="display:flex;gap:8px;align-items:center;color:var(--tx)"><input type="checkbox" id="slmin" style="width:auto" ${d.set.min_price_on===true?"checked":""}> تفعيل «الحد الأدنى لسعر البيع» (بتحدده لكل براند تحت). مقفول = السيلر تبيع بأي سعر فوق سعرها.</label><label>هدف الشهر للسيلرات: عدد الأوردرات المسلّمة في الشهر (0 = مقفول) ومكافأة ثابتة (ج.م) عند تحقيقه</label><div class="row"><input type="number" id="slgo" min="0" value="${Number((d.set.goal||{}).orders)||0}" placeholder="عدد الأوردرات"><input type="number" id="slgb" min="0" value="${Number((d.set.goal||{}).bonus)||0}" placeholder="المكافأة"></div><label>فترة الانتظار قبل ما العمولة تبقى متاحة (بالأيام)</label><div class="row"><input type="number" id="slhd" min="0" value="${Number(d.set.hold_days)||0}" style="max-width:120px"><button class="btn" id="slsave" style="margin:0">حفظ</button></div><label>مكافأة الإحالة (ج.م) — بتتدفع للسيلر اللي أحالت لما المُحالة تاخد أول عمولة. 0 = مقفولة</label><input type="number" id="slrb" min="0" value="${Number(d.set.ref_bonus)||0}" style="max-width:120px"><label>خصم الكمية (لكل السيلرات): لما الأوردر يوصل لعدد أزواج، تكلفة السيلر تقل بمبلغ على كل زوج (وعمولتها بتزيد). سيب الفاضي لو مش عايز مستوى</label>${[0,1,2].map(i=>{const t=((d.set.qty_tiers)||[])[i]||{};return `<div class="row"><input type="number" min="1" data-gqm="${i}" value="${t.min||""}" placeholder="من كام زوج"><input type="number" min="0" data-gqo="${i}" value="${t.off||""}" placeholder="خصم على الزوج ج.م"></div>`}).join("")}<label>مكافأة كل عدد أزواج مسلّمة (لكل السيلرات): مبلغ و/أو هدية</label><div class="row"><input type="number" min="0" id="grve" value="${(d.set.pair_reward||{}).every||""}" placeholder="كل كام زوج"><input type="number" min="0" id="grva" value="${(d.set.pair_reward||{}).amount||""}" placeholder="المبلغ ج.م"></div><input id="grvg" value="${qa((d.set.pair_reward||{}).gift||"")}" placeholder="الهدية (اختياري) مثلاً: محلول"><button class="btn" id="gsave">حفظ الخصم والمكافأة</button><div class="m" id="slmsg4"></div>
  <div class="m" id="slmsg2"></div></div>
  ${tiersUI}
  <div class="card"><b>أسعار السيلرات (سعر الجوز)</b><p class="m">الخانة الأولى (يمين) حد أدنى لسعر بيع الجوز للعميلة، والتانية سعر السيلر. السعر الفاضي = المنتج مش ظاهر للسيلرات، والحد الأدنى الفاضي = سعر السيلر نفسه. السعر بيتجمّد على الأوردر وقت تسجيله، فتعديله ما بيغيّرش الأوردرات القديمة.</p>${d.brands.map(b=>`<div class="row" style="flex-wrap:nowrap;margin-bottom:6px;align-items:center"><span style="flex:1">${esc(b)}</span><input type="number" inputmode="decimal" data-bm="${qa(b)}" value="${d.mm[b]==null?"":d.mm[b]}" placeholder="حد أدنى للبيع" style="max-width:120px"><input type="number" inputmode="decimal" data-bp="${qa(b)}" value="${d.pm[b]==null?"":d.pm[b]}" placeholder="غير متاح" style="max-width:130px"></div>`).join("")}${(d.accs||[]).length?`<b style="display:block;margin-top:12px">المحاليل والماجيك بوكس والحافظات</b><p class="m">نفس فكرة العدسات بالظبط: سعر السيلر للقطعة، وحد أدنى للبيع (لو مفعّل فوق). الفاضي = الصنف مش ظاهر للسيلرات. الصنف اللي كميته صفر بيختفي عندها لوحده ويرجع لما تتورّد كمية.</p>${d.accs.map(a=>`<div class="row" style="flex-wrap:nowrap;margin-bottom:6px;align-items:center"><span style="flex:1">${esc(a.label)}</span><input type="number" inputmode="decimal" data-bm="${qa(a.key)}" value="${d.mm[a.key]==null?"":d.mm[a.key]}" placeholder="حد أدنى للبيع" style="max-width:120px"><input type="number" inputmode="decimal" data-bp="${qa(a.key)}" value="${d.pm[a.key]==null?"":d.pm[a.key]}" placeholder="غير متاح" style="max-width:130px"></div>`).join("")}`:""}<div class="m" id="slmsg3"></div></div>
  <div class="card"><b>صور ومنشورات البراندات</b><p class="m">صور البراند للسيلرات بتتاخد تلقائي من صور الألوان في لوحة الموقع (مفيش رفع مرتين). رفع صورة هنا اختياري، وبيغلب صورة الموقع لصورة غلاف البراند بس. اكتب منشور جاهز تنسخه السيلر.</p>${d.brands.map(b=>{const i=(d.info||{})[b]||{};return `<div style="border-top:1px solid var(--bd);padding-top:8px;margin-top:8px"><div class="row" style="flex-wrap:nowrap;align-items:center"><img src="${qa(brandImg(b,i))}" alt="" style="width:72px;height:54px;object-fit:cover;border-radius:8px;flex:0 0 72px"><b style="flex:1">${esc(b)}</b><label class="btn sec" style="margin:0;flex:0 0 auto;text-align:center">📷 صورة<input type="file" accept="image/*" hidden data-bimg="${qa(b)}"></label>${i.img?`<button class="btn sec" style="margin:0;flex:0 0 auto" data-bimgx="${qa(b)}">✖</button>`:""}</div><textarea data-bpst="${qa(b)}" placeholder="المنشور الجاهز للبراند ده" style="margin-top:6px">${esc(i.post||"")}</textarea></div>`}).join("")}</div>
  <div class="card"><b>السيلرات</b></div>${sel||'<div class="empty">مفيش سيلرات لسه</div>'}`;
}
function sellersBind(on){
  on("#slsave","click",async()=>{const m=$("#slmsg2"),a=await sb.from("app_settings").upsert({key:"seller_review",value:$("#slrev").checked}),b=await sb.from("app_settings").upsert([{key:"hold_days",value:Math.max(0,parseInt($("#slhd").value)||0)},{key:"ref_bonus",value:Math.max(0,Number($("#slrb").value)||0)},{key:"min_price_on",value:$("#slmin").checked},{key:"goal",value:{orders:Math.max(0,parseInt($("#slgo").value)||0),bonus:Math.max(0,Number($("#slgb").value)||0)}}]);m.textContent=a.error||b.error?"فشل الحفظ":"تم الحفظ"});
  on("[data-bp]","change",async e=>{const v=e.value.trim(),{error}=await sb.from("seller_prices").upsert({brand:e.dataset.bp,price:v===""?null:Number(v),updated_at:new Date().toISOString()});$("#slmsg3").textContent=error?"فشل حفظ السعر":"تم حفظ سعر "+e.dataset.bp});
  on("#slper","change",e=>{S.slper=e.value;render()});
  on("#tsave","click",async()=>{const t=((S.sl.set.tiers)||[]).map((x,i)=>({name:($(`[data-tn="${i}"]`).value||x.name).trim(),min:i===0?0:Math.max(0,parseInt($(`[data-tm="${i}"]`).value)||0),pct:Math.max(0,Number($(`[data-tp="${i}"]`).value)||0),bonus:Math.max(0,Number($(`[data-tb="${i}"]`).value)||0)}));
    for(let i=1;i<t.length;i++)if(t[i].min<=t[i-1].min)return alert("لازم كل مستوى يبدأ من عدد أكبر من اللي قبله");
    const {error}=await sb.from("app_settings").upsert({key:"tiers",value:t});$("#tmsg").textContent=error?"فشل الحفظ":"تم الحفظ";if(!error){S.sl.set.tiers=t}});
  on("[data-bm]","change",async e=>{const v=e.value.trim(),{error}=await sb.from("seller_prices").upsert({brand:e.dataset.bm,min_price:v===""?null:Number(v)});$("#slmsg3").textContent=error?"فشل حفظ الحد الأدنى":"تم حفظ الحد الأدنى لـ"+e.dataset.bm});
  on("[data-wp]","click",e=>{const r=(S.sl.reqs||[]).find(x=>x.id==e.dataset.wp),sl=S.sl.sellers.find(x=>x.id===r.seller_id);if(!sl||!sl.phone)return alert("مفيش رقم للسيلر");
    window.open("https://wa.me/"+waNum(sl.phone)+"?text="+encodeURIComponent(`أهلاً ${sl.name} 🌸\nتم تحويل ${r.amount} ج.م على ${r.method} (${r.account}) ✅\nشكرًا لشغلك مع Classy Eyes 💙`),"_blank")});
  on("[data-bimg]","change",async e=>{const f=e.files[0];if(!f)return;const path="b"+Date.now()+".jpg",{error}=await sb.storage.from("brand-images").upload(path,await shrink(f),{contentType:"image/jpeg"});if(error)return alert("فشل رفع الصورة");const r=await sb.from("brand_info").upsert({brand:e.dataset.bimg,image_path:path,updated_at:new Date().toISOString()});if(r.error)return alert("فشل الحفظ");await loadSellers();render()});
  on("[data-bimgx]","click",async e=>{if(!confirm("رجوع للصورة التجريبية؟"))return;await sb.from("brand_info").upsert({brand:e.dataset.bimgx,image_path:null});await loadSellers();render()});
  on("[data-bpst]","change",async e=>{const {error}=await sb.from("brand_info").upsert({brand:e.dataset.bpst,post:e.value,updated_at:new Date().toISOString()});$("#slmsg3").textContent=error?"فشل حفظ المنشور":"تم حفظ منشور "+e.dataset.bpst});
  on("[data-ap]","click",async e=>{const id=e.dataset.ap,ov=Number(($(`[data-ob="${id}"]`)||{}).value)||0,{error}=await sb.from("profiles").update({role:"seller",app_status:"approved"}).eq("id",id);if(error)return alert("فشل القبول");
    if(ov){const r=await sb.rpc("admin_set_opening",{p_seller:id,p_amount:ov,p_note:""});if(r.error)alert("اتقبلت، لكن فشل الرصيد الافتتاحي: "+r.error.message)}await loadSellers();render()});
  on("#jcp","click",()=>{const t=$("#joinlink").value;(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>alert("تم نسخ اللينك"),()=>{$("#joinlink").select();alert("اللينك متحدد، انسخه")})});
  on("#jwa","click",()=>window.open("https://wa.me/?text="+encodeURIComponent("أهلاً 🌸 سجّلي كسيلر مع Classy Eyes من اللينك ده:\n"+$("#joinlink").value),"_blank"));
  on("[data-pf]","click",e=>showProof(e.dataset.pf));
  on("#gsave","click",async()=>{const t=[0,1,2].map(i=>({min:parseInt($(`[data-gqm="${i}"]`).value)||0,off:Number($(`[data-gqo="${i}"]`).value)||0})).filter(x=>x.min>0&&x.off>0).sort((a,b)=>a.min-b.min),ev=parseInt($("#grve").value)||0,am=Number($("#grva").value)||0,gf=$("#grvg").value.trim();
    if(ev>0&&!am&&!gf)return alert("اكتب مبلغ أو هدية للمكافأة");
    const {error}=await sb.from("app_settings").upsert([{key:"qty_tiers",value:t},{key:"pair_reward",value:ev>0?{every:ev,amount:am,gift:gf}:{every:0,amount:0,gift:""}}]);$("#slmsg4").textContent=error?"فشل الحفظ":"تم الحفظ";if(!error){S.sl.set.qty_tiers=t;S.sl.set.pair_reward={every:ev,amount:am,gift:gf}}});
  on("[data-so]","click",e=>{S.slopen=S.slopen||{};S.slopen[e.dataset.so]=!S.slopen[e.dataset.so];render()});
  const spSave=async e=>{const [sid,b]=(e.dataset.spb||e.dataset.spm).split("|"),pe=$(`[data-spb="${sid}|${b}"]`),me=$(`[data-spm="${sid}|${b}"]`),pv=pe.value.trim(),mv=me.value.trim();
    const r=pv===""&&mv===""?await sb.from("seller_brand_prices").delete().eq("seller_id",sid).eq("brand",b):await sb.from("seller_brand_prices").upsert({seller_id:sid,brand:b,price:pv===""?null:Number(pv),min_price:mv===""?null:Number(mv),updated_at:new Date().toISOString()});
    if(r.error)return alert("فشل حفظ السعر: "+r.error.message);S.sl.bp=(S.sl.bp||[]).filter(x=>!(x.seller_id===sid&&x.brand===b));if(pv!==""||mv!=="")S.sl.bp.push({seller_id:sid,brand:b,price:pv===""?null:Number(pv),min_price:mv===""?null:Number(mv)})};
  on("[data-spb]","change",spSave);on("[data-spm]","change",spSave);
  on("[data-ssv]","click",async e=>{const id=e.dataset.ssv,g=k=>($(`[${k}]`)||{}).value||"",
    qt=[0,1,2].map(i=>({min:parseInt(g(`data-sqm="${id}|${i}"`))||0,off:Number(g(`data-sqo="${id}|${i}"`))||0})).filter(x=>x.min>0&&x.off>0).sort((a,b)=>a.min-b.min),
    ev=parseInt(g(`data-srv="${id}|e"`))||0,am=Number(g(`data-srv="${id}|a"`))||0,gf=g(`data-srv="${id}|g"`).trim(),go=parseInt(g(`data-sgl="${id}|o"`))||0,gb=Number(g(`data-sgl="${id}|b"`))||0;
    if(ev>0&&!am&&!gf)return alert("اكتب مبلغ أو هدية للمكافأة");if(go>0&&!gb)return alert("اكتب مكافأة الهدف");
    const row={seller_id:id,qty_tiers:qt.length?qt:null,reward:ev>0?{every:ev,amount:am,gift:gf}:null,goal:go>0?{orders:go,bonus:gb}:null,updated_at:new Date().toISOString()};
    const {error}=await sb.from("seller_settings").upsert(row);$(`[data-ssm="${id}"]`).textContent=error?"فشل الحفظ: "+error.message:"تم الحفظ";if(!error){S.sl.ss=(S.sl.ss||[]).filter(x=>x.seller_id!==id);S.sl.ss.push(row)}});
  on("[data-rf]","change",e=>{const n=$(`[data-rfn="${e.dataset.rf}"]`);if(n)n.textContent=e.files[0]?"✔ "+e.files[0].name:""});
  on("[data-obs]","click",async e=>{const id=e.dataset.obs,v=$(`[data-obv="${id}"]`).value.trim(),a=v===""?0:Number(v);if(!isFinite(a))return alert("اكتب رقم صحيح");if(!confirm("تثبيت الرصيد الافتتاحي "+a+" ج.م؟"))return;const {error}=await sb.rpc("admin_set_opening",{p_seller:id,p_amount:a,p_note:""});if(error)return alert(error.message);await loadSellers();render()});
  on("[data-ar]","click",async e=>{if(!confirm("رفض الطلب؟"))return;const {error}=await sb.from("profiles").update({app_status:"rejected"}).eq("id",e.dataset.ar);if(error)return alert("فشل الرفض");await loadSellers();render()});
  on("[data-rp]","click",async e=>{if(!confirm("اتأكدت إنك حوّلت المبلغ؟"))return;const pr=await upProof($(`[data-rf="${e.dataset.rp}"]`),e.dataset.sid);if(pr===null)return;const {error}=await sb.rpc("admin_handle_request",{p_id:Number(e.dataset.rp),p_action:"pay",p_note:"",p_proof:pr||null});if(error)return alert(error.message);await loadSellers();render()});
  on("[data-rr]","click",async e=>{const n=prompt("سبب الرفض (اختياري)");if(n===null)return;const {error}=await sb.rpc("admin_handle_request",{p_id:Number(e.dataset.rr),p_action:"reject",p_note:n});if(error)return alert(error.message);await loadSellers();render()});
  on("[data-pay]","click",async e=>{const id=e.dataset.pay,a=Number($(`[data-pa="${id}"]`).value),n=$(`[data-pn="${id}"]`).value;if(!(a>0))return alert("اكتب مبلغ صحيح");if(!confirm("تسجيل تحويل "+a+" ج.م؟"))return;const pr=await upProof($(`[data-pfi="${id}"]`),id);if(pr===null)return;const {error}=await sb.rpc("admin_payout",{p_seller:id,p_amount:a,p_note:n,p_proof:pr||null});if(error)return alert(error.message);await loadSellers();render()});
}

init();
</script>
</body>
